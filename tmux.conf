# Set prefix2 to ctrl-a.
set -g prefix2 C-a
bind C-a send-prefix -2


# Disable auto rename of window title.
set-option -g allow-rename off

# nvim told me to set escape time, focus events, and terminal-overrides.
set-option -sg escape-time 10
set-option -g focus-events on
set-option -sa terminal-overrides ',xterm-256color:RGB'


# Enable mouse mode (for tmux 2.1 and above).
set -g mouse on

# Eliminate gaps in window numbers.
set-option -g renumber-windows on

# Start with window 1 (instead of 0).
set -g base-index 1

# Start with pane 1.
set -g pane-base-index 1


# Set default terminal mode to 256 colors.
set -g default-terminal "screen-256color"

# Lots of history.
set -g history-limit 999999

# Extended keys for coding agents.
set -s extended-keys on


# From: https://github.com/ddrscott/ddrscott/blob/master/tmux.conf
# Set the pane border style for the currently active pane.  For how to specify style, see the message-command-style option.  Attributes are ignored.
set -g pane-active-border-style 'fg=colour243,bg=colour234,noreverse'
set -g pane-border-style 'fg=colour243,bg=colour234,noreverse'

set -g window-style 'fg=default,bg=colour234'
set -g window-active-style 'fg=default,bg=black'


# Disable the status bar. It's kind of annoying.
set -g status off

# Remove annoying highlight
unbind-key  -T root  MouseDown3Pane

# Remove annoying copy on mouse selection.
unbind -T copy-mode-vi MouseDragEnd1Pane


unbind '"'
unbind %


# Copy Mode

set -s set-clipboard on

set-window-option -g mode-keys vi

# Use 'v' to start a selection.
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Use 'y' to copy the selection on Linux.
if-shell 'uname | grep -q Linux' {
  set -s copy-command 'xsel -i'
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xsel -i'
}

# Use 'y' to copy the selection on macOS.
if-shell 'uname | grep -q Darwin' {
  set -s copy-command 'pbcopy'
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
}

# Use escape or 'q' to exit copy-mode.
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel


# Keybindings

# Store the path to the tmux-commands script.
set-option -g @tmux_commands '~/bin/tmux-commands.zsh'

# General

# Use meta-n to open a command menu.
bind -n M-n run-shell "#{@tmux_commands} show-menu"

# Use meta+y to open a command palette.
bind -n M-y run-shell "#{@tmux_commands} show-command-palette"



# Use meta+t to choose a session and window.
bind -n M-t choose-tree -wZ

# Use meta+p to open a session chooser.
bind -n M-p run-shell "#{@tmux_commands} choose-session"

# Use meta+o to open supertree.
bind -n M-o run-shell "#{@tmux_commands} show-supertree"

# Use meta+u and meta+shift+U to open hometown.
bind -n M-u run-shell "hometown show-windows"
bind -n M-U run-shell "hometown show-sessions"


# hometown — alt+{hjkl;} to switch windows.
bind -n M-h run-shell "hometown switch-window h"
bind -n M-j run-shell "hometown switch-window j"
bind -n M-k run-shell "hometown switch-window k"
bind -n M-l run-shell "hometown switch-window l"
bind -n 'M-;' run-shell "hometown switch-window sc"

# hometown — alt+shift+{hjkl;} to switch sessions.
bind -n M-H run-shell "hometown switch-session h"
bind -n M-J run-shell "hometown switch-session j"
bind -n M-K run-shell "hometown switch-session k"
bind -n M-L run-shell "hometown switch-session l"
bind -n 'M-:' run-shell "hometown switch-session sc"

# bind -n M-Space run-shell "#{@tmux_commands} flashback"


# Sessions.
bind -n M-S run-shell "#{@tmux_commands} create-new-session"
bind -n M-P switch-client -l

# Windows within current session.
bind -n M-N run-shell "hometown new-window"
bind -n M-Q run-shell "hometown kill-window"


# Popup terminals — ctrl+{jk} to toggle popup, alt+= to expand/collapse.
bind -n C-j run-shell "#{@tmux_commands} floating-terminal J"
bind -n C-k run-shell "#{@tmux_commands} floating-terminal K"
bind -n M-= run-shell "#{@tmux_commands} expand-popup"

# Clean up popup terminals when a session is killed.
set-hook -g session-closed "run-shell '#{@tmux_commands} popup-cleanup #S'"


# Zen mode — alt+z to toggle, alt+shift+Z to resize.
bind -n M-z run-shell "#{@tmux_commands} toggle-zen"
bind -n M-Z run-shell "#{@tmux_commands} resize-zen"

# Field Kit keybindings
if-shell "[ -f /Users/john/.config/kit/keybindings.tmux ]" "source-file /Users/john/.config/kit/keybindings.tmux"
